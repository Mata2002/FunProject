<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Animation</title>
  <style>
    /* Variables */
    :root {
      --dark-bg: #292B25;
      --shadow: #1B1D18;
      --ghost-white: #F0EFDC;
      --face-dark: #271917;
      --face-pink: #F5C1B6;
      --ghost-width: 80px;
      --ghost-height: 115px;
      --star-blue: #83D0BC;
      --star-yellow: #FFD186;
      --star-orange: #DF814D;
      --ghost-exit-speed: 800ms;
      --ghost-entrance-speed: 2000ms;
      --waving-speed: 400ms;
      --blink-speed: 50ms;
      --mouth-speed: 150ms;
      --shadow-disappear-speed: 400ms;
      --shadow-appear-speed: 800ms;
      --star-entrance-speed: 1500ms;
      --star-exit-speed: 400ms;
      --star-exit-delay: 200ms;
      --star-entrance-delay: 200ms;
    }

    /* Keyframes */
    @keyframes hover { 0% { top: 0; } 100% { top: 8px; } }
    @keyframes star-entrance { 0% { transform: rotate(-735deg) scale(0, 0); } 100% { transform: rotate(0) scale(1, 1); } }
    @keyframes star-exit { 0% { transform: rotate(0) scale(1, 1); } 100% { transform: rotate(360deg) scale(0, 0); } }
    @keyframes waving { 0% { transform: rotate(-45deg); } 50% { transform: rotate(-55deg); } 100% { transform: rotate(-45deg); } }

    /* Styling */
    body { height: 100vh; display: flex; justify-content: center; align-items: center; background-color: var(--dark-bg); }
    .scene-container { position: relative; width: 140px; height: 160px; outline: none; }
    .ghost-container { position: relative; width: var(--ghost-width); height: calc(var(--ghost-height) + 25px); overflow: hidden; }
    .ghost { transition: transform var(--ghost-entrance-speed) ease-out; animation: hover 600ms ease-in-out infinite alternate; }

    /* Ghost Parts */
    .ghost-head, .ghost-body { background-color: var(--ghost-white); }
    .eye { background-color: var(--face-dark); }
    .cheek { background-color: var(--face-pink); }
    .star-element { animation: star-entrance var(--star-entrance-speed); }
  </style>
</head>
<body>
  <div class="scene-container stars-out" tabindex="1">
    <div class="ghost-container">
      <div class="ghost">
        <div class="ghost-head">
          <div class="ghost-face">
            <div class="eyes-row">
              <div class="eye left"></div>
              <div class="eye right"></div>
            </div>
            <div class="mouth-row">
              <div class="cheek left"></div>
              <div class="mouth"><div class="mouth-top"></div><div class="mouth-bottom"></div></div>
              <div class="cheek right"></div>
            </div>
          </div>
        </div>
        <div class="ghost-body"><div class="ghost-hand hand-left"></div><div class="ghost-hand hand-right"></div></div>
      </div>
      <div class="stars"><div class="star-element"></div></div>
    </div>
    <div class="shadow-container"><div class="shadow"></div><div class="shadow-bottom"></div></div>
  </div>

  <script>
    class Ghost {
      constructor(el) {
        this.scene = el;
        this.isEscaping = false;
        this.ghost = el.querySelector('.ghost');
        this.face = el.querySelector('.ghost-face');
        this.eyes = el.querySelector('.eyes-row');
        this.leftEye = this.eyes.querySelector('.left');
        this.rightEye = this.eyes.querySelector('.right');
        this.mouth = el.querySelector('.mouth');
        this.shadow = el.querySelector('.shadow-container');
        this.activityInterval = null;
      }

      blink() {
        this.leftEye.classList.add('blink');
        this.rightEye.classList.add('blink');
        setTimeout(() => { this.leftEye.classList.remove('blink'); this.rightEye.classList.remove('blink'); }, 50);
      }

      wave() {
        this.leftHand.classList.add('waving');
        setTimeout(() => { this.leftHand.classList.remove('waving'); }, 500);
      }

      runAway() {
        clearInterval(this.activityInterval);
        if (!this.isEscaping) {
          this.isEscaping = true;
          this.scene.classList.add('run-away', 'move-stars-in');
          setTimeout(() => { this.reset(); }, 500);
        }
      }

      reset() { this.scene.classList.add('descend'); }
      startActivity() { this.activityInterval = setInterval(() => { this.blink(); }, 7000); }
      prepareEscape() {
        this.scene.addEventListener('click', () => { this.runAway(); });
        this.scene.addEventListener('mouseover', () => { this.runAway(); });
      }
    }

    let ghost = new Ghost(document.querySelector('.scene-container'));
    ghost.startActivity();
    ghost.prepareEscape();
  </script>
</body>
</html>
